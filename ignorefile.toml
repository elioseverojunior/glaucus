version = 1

[[gitignore.section]]

# The note below is the header this file GENERATES into .gitignore, not a header
# for this file itself (REUSE.toml's `**` rule covers that). The closing `"""`
# sits on the tag line, so REUSE reads the expression as `MIT OR Apache-2.0"""`
# and rejects it — these markers are REUSE's own sanctioned escape for a string
# that is deliberately not meant to parse as an SPDX expression.
[[gitignore.section.rule]]
note = """
SPDX-FileCopyrightText: Glaucus contributors

SPDX-License-Identifier: MIT OR Apache-2.0"""

[[gitignore.section]]
level = 3
name = "IDEs ###"
note = "Ignoring IDEs Configuration files"

[[gitignore.section.rule]]
ignore = [
  ".idea/**/workspace.xml",
  ".idea/**/tasks.xml",
  ".idea/**/usage.statistics.xml",
  ".idea/**/dictionaries",
  ".idea/**/shelf",
]
note = "User-specific stuff"

[[gitignore.section.rule]]
ignore = [".idea/**/aws.xml"]
note = "AWS User-specific"

[[gitignore.section.rule]]
ignore = [".idea/**/contentModel.xml"]
note = "Generated files"

[[gitignore.section.rule]]
ignore = [
  ".idea/**/dataSources/",
  ".idea/**/dataSources.ids",
  ".idea/**/dataSources.local.xml",
  ".idea/**/sqlDataSources.xml",
  ".idea/**/dynamic.xml",
  ".idea/**/uiDesigner.xml",
  ".idea/**/dbnavigator.xml",
]
note = "Sensitive or high-churn files"

[[gitignore.section.rule]]
ignore = [".idea/**/gradle.xml", ".idea/**/libraries"]
note = "Gradle"

[[gitignore.section.rule]]
ignore = ["cmake-build-*/"]
note = "CMake"

[[gitignore.section.rule]]
ignore = [".idea/**/mongoSettings.xml"]
note = "Mongo Explorer plugin"

[[gitignore.section.rule]]
ignore = ["*.iws"]
note = "File-based project format"

[[gitignore.section.rule]]
ignore = ["out/"]
note = "IntelliJ"

[[gitignore.section.rule]]
ignore = [".idea_modules/"]
note = "mpeltonen/sbt-idea plugin"

[[gitignore.section.rule]]
ignore = ["atlassian-ide-plugin.xml"]
note = "JIRA plugin"

[[gitignore.section.rule]]
ignore = [".idea/replstate.xml"]
note = "Cursive Clojure plugin"

[[gitignore.section.rule]]
ignore = [".idea/sonarlint/"]
note = "SonarLint plugin"

[[gitignore.section.rule]]
ignore = [
  "com_crashlytics_export_strings.xml",
  "crashlytics.properties",
  "crashlytics-build.properties",
  "fabric.properties",
]
note = "Crashlytics plugin (for Android Studio and IntelliJ)"

[[gitignore.section.rule]]
ignore = [".idea/httpRequests"]
note = "Editor-based Rest Client"

[[gitignore.section.rule]]
ignore = [".idea/caches/build_file_checksums.ser"]
note = "Android studio 3.1+ serialized cache file"

[[gitignore.section]]
level = 3
name = "Intellij+all Patch ###"
note = """
Ignore everything but code style settings and run configurations
that are supposed to be shared within teams."""

[[gitignore.section.rule]]
add = [".idea/codeStyles", ".idea/runConfigurations"]
ignore = [".idea/*"]

[[gitignore.section.rule]]
ignore = ["/.idea/", "/.vscode/", "*.iml"]
note = "Generic"

[[gitignore.section]]
level = 3
name = "Rust ###"
note = """
Generated by Cargo
will have compiled files and executables"""

[[gitignore.section.rule]]
ignore = ["debug/", "dist/", "target/"]

[[gitignore.section.rule]]
ignore = ["**/*.rs.bk"]
note = "These are backup files generated by rustfmt"

[[gitignore.section.rule]]
ignore = ["*.pdb"]
note = "MSVC Windows builds of rustc generate these, which store debugging information"

[[gitignore.section.rule]]
ignore = ["*.rlib"]
note = "Stray rlib artifacts (can appear in worktree root from cargo invocations)"

[[gitignore.section]]
level = 3
name = "rust-analyzer ###"
note = "Can be generated by other build systems other than cargo (ex: bazelbuild/rust_rules)"

[[gitignore.section.rule]]
ignore = ["rust-project.json"]

[[gitignore.section]]
level = 3
name = "Rust Coverage with Tarpaulin"

[[gitignore.section.rule]]
ignore = [
  "tarpaulin-report.html",
  "tarpaulin-report.json",
  "cobertura.xml",
  "lcov.info",
]

[[gitignore.section]]
level = 3
name = "Rust cargo-mutants ###"

[[gitignore.section.rule]]
ignore = ["/**/mutants*/"]

[[gitignore.section]]
level = 3
name = "Personal Ignores ###"

[[gitignore.section.rule]]
ignore = [
  "/glaucus-fuzz/target/",
  "/glaucus-fuzz/artifacts/",
  "/glaucus-fuzz/corpus/fuzz_*/",
  "/target",
  "/build_rs_cov.profraw",
]

[[gitignore.section.rule]]
ignore = [".claude/settings.local.json"]
note = "Claude Code local settings"

[[gitignore.section.rule]]
ignore = [".rumdl_cache/"]
note = "rumdl (Markdown lint) incremental cache"

[[gitignore.section]]
level = 3
name = "Project Ignores"

[[gitignore.section.rule]]
ignore = ["/bench-report/", "/bench-output.txt"]

[[gitignore.section]]
name = "Python ###"

[[gitignore.section.rule]]
ignore = ["/**/__pycache__/", ".venv", "venv"]
note = "Python Project Ignore"

[[gitignore.section]]
name = "Mise ###"

[[gitignore.section.rule]]
ignore = ["/mise.local.toml"]
note = """
mise.local.toml is machine-specific (written by `mise run setup`); mise.lock is
committed on purpose, because [settings] lockfile = true pins tool versions."""

[[gitignore.section]]
name = "Development Tools"

[[gitignore.section.rule]]
ignore = ["/.remember/"]
note = "Agent session state"

[[gitignore.section.rule]]
ignore = ["/.rumdl_cache/"]
note = "Linter caches"

[[gitignore.section]]
name = "Operational Systems"

[[gitignore.section.rule]]
ignore = [".DS_Store"]
note = "macOS"

[[gitignore.section.rule]]
ignore = ["*~", ".fuse_hidden*", ".directory", ".Trash-*", ".nfs*"]
note = "Linux"

[[gitignore.section]]
name = "Nektos/ACT"

[[gitignore.section.rule]]
add = [".act/README.md"]
ignore = [".act/*"]
note = """
Nektos/act scratch state. `mise run act` writes a live `gh auth token` into
.act/.secrets, so nothing in here may be committed -- only the README, which
says exactly that."""

[[gitignore.section]]
name = "Others"

[[gitignore.section.rule]]
ignore = ["/comply-dry-run.txt"]
note = "Misc"

[[gitignore.section.rule]]
ignore = ["/**/scorecard.json"]
note = "Scorecard"

[[gitignore.section]]
name = "NodeJS"

[[gitignore.section.rule]]
ignore = ["/**/node_modules/", "/**/dist/", "/**/cache/deps/"]
note = "Project/Workspaces Ignores"

[[gitignore.section.rule]]
ignore = [
  "/**/.vitepress/dist/",
  "/**/.vitepress/cache/",
  "/**/.playwright-mcp/",
]
note = """
Docs site (VitePress, managed with bun). `bun.lock` IS tracked -- it is the
supply-chain record for the site's dependencies, the same reason Cargo.lock is
tracked. Only the installed tree and build output are ignored."""
