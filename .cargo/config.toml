# Custom alias commands shortcuts
[alias]
b = "build"
c = "check"
t = "test"

[build]
# Workspace warning gate. `-D warnings` turns every rustc lint into a hard error
# when compiling a WORKSPACE crate (build / test / clippy / check, locally and in
# CI). Cargo passes `--cap-lints allow` to registry & git dependencies, so this
# never fails on third-party crates — only on our own code.
#
# This replaces the `RUST_FLAGS: "-D warnings"` that used to sit in cicd.yml:
# `RUST_FLAGS` is not a real variable (the env var is `RUSTFLAGS`), so that gate
# was a silent no-op. Centralizing it here fixes the typo and de-duplicates it.
#
# To make this CI-only instead (e.g. if warnings-as-errors is too aggressive for
# local/IDE iteration), delete this line and set `RUSTFLAGS: -D warnings` in the
# CI workflow env instead.
# `target-cpu=native` is deliberately NOT here. Cargo REPLACES `[build]
# rustflags` with `[target.<triple>] rustflags` rather than merging them, and
# every triple built here has an override below -- so the flag never reached a
# local or CI build anyway. Where it WOULD have applied is any triple without an
# override, which is exactly the set a release matrix adds
# (`*-unknown-linux-musl`, `*-pc-windows-msvc`): those would be compiled for the
# build machine's CPU and can abort with SIGILL on an older one. Native tuning is
# a per-machine choice, so it belongs in a developer's own `RUSTFLAGS`, never in
# committed config that a release build inherits.
rustflags = ["-D", "warnings"]

# Documentation lint gate: promotes rustdoc lints (broken_intra_doc_links,
# redundant_explicit_links, bare_urls, invalid_html_tags, …) to hard errors so
# broken docs fail the build instead of printing an ignorable warning.
rustdocflags = ["-D", "warnings"]

[env]
# Ensures the cc crate uses the correct cross-compiler for the target
CC_aarch64_unknown_linux_gnu = "aarch64-linux-gnu-gcc"
# Ensures host build-dependencies use your local host compiler
HOST_CC = "gcc"

# ─── Build profiles: THE single source of truth ──────────────────────────────
#
# Every profile lives here and NOWHERE else. `Cargo.toml` deliberately declares
# no `[profile.*]` at all, and `mise run profile:check` enforces that.
#
# The enforcement is the point, not tidiness. Cargo resolves a conflict between
# the two in favour of THIS file, silently -- no error, no warning. A
# `[profile.release]` added to the manifest would simply never reach rustc, which
# is exactly how the release build shipped at `opt-level = "z"` while the manifest
# said `3` and carried a comment explaining why size optimisation had been
# abandoned. See issue #8.
#
# Note these apply only to builds INSIDE this repository. A downstream crate
# depending on glaucus is governed by its own profiles; nothing here reaches it.

[profile.dev]
debug = true
incremental = true
# Our own crates, kept low for a fast edit->compile loop.
opt-level = 1
panic = "abort"

# Optimize DEPENDENCY crates even in debug builds. Deps compile once and are
# cached, so this barely touches the edit->compile loop on our own crates, but it
# makes debug `cargo run` / `cargo test` execute close to release speed -- useful
# when exercising the parser over real YAML fixtures locally.
[profile.dev.package."*"]
opt-level = 3

# `opt-level = 0` for tests specifically, overriding the `1` that `test` would
# otherwise inherit from `dev`. This exists for the coverage gate, not for speed.
#
# At `opt-level = 1` LLVM merges basic blocks that consist of a single trivial
# expression, and it makes that decision per backend -- so a function whose arms
# are all unit-tested can still report lines unexecuted on one target and covered
# on another. Unoptimised, the arms stay distinct blocks and attribution matches
# the source everywhere. Tests build slower; a gate whose verdict depends on the
# host does not tell you anything.
[profile.test]
opt-level = 0

[profile.release]
# MAX RUNTIME SPEED. `opt-level = "z"` optimizes for *binary size*, which is the
# opposite of fast -- it suppresses inlining and vectorization. `3` is the fastest
# codegen and the right default for a parser's hot path.
opt-level = 3
# Whole-program, cross-crate inlining: the slowest link, the fastest code. Worth
# it here because the satellite crates inline straight into `glaucus`.
lto = "fat"
# One codegen unit => the optimizer sees the whole crate at once (no per-unit
# boundaries to block inlining). Slowest compile, best code.
codegen-units = 1
# Drop unwinding tables / landing pads from OUR binaries. (Irrelevant to the
# published library -- a consumer's own profile decides its panic strategy.)
panic = "abort"
# Smaller artifacts at zero runtime cost. No debug info is kept here; profile via
# the `profiling` profile below instead.
debug = false
strip = "symbols"

# WASM is downloaded before it runs, so its *size* IS its performance. Keep
# glaucus-wasm tuned for a small `.wasm` rather than inheriting the native
# `opt-level = 3` above (which would bloat the module). `"s"` balances size/speed;
# switch to `"z"` for the smallest possible module.
[profile.release.package.glaucus-wasm]
opt-level = "s"

# Release-grade codegen but WITH line-table symbols and no stripping, so
# `cargo flamegraph` / `perf` can attribute samples back to source. The `flame`
# mise task builds with this profile (`--profile profiling`).
[profile.profiling]
debug = "line-tables-only"
inherits = "release"
strip = false

# Target-specific linker improvements.
# macOS ARM (Apple Silicon) — use the system ld64
[target.aarch64-apple-darwin]
rustflags = ["-D", "warnings", "-C", "link-arg=-Wl,-dead_strip_dylibs"]

# macOS x86_64
[target.x86_64-apple-darwin]
rustflags = ["-D", "warnings", "-C", "link-arg=-Wl,-dead_strip_dylibs"]

# Linux x86_64 — use mold if available for faster linking
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-D", "warnings", "-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
