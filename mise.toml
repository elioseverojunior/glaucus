# mise configuration ~ https://mise.jdx.dev
#
# mise provisions the Rust toolchain, but the VERSION stays defined once in
# `rust-toolchain.toml` (the canonical file rustup, cargo and IDEs also read).
# Enabling the idiomatic-version-file setting below lets mise install Rust from
# that file, so there is a single source of truth and no drift. Node works the
# same way: its version lives in package.json's `devEngines.runtime`. Auxiliary
# tools (git-cliff, hk, etc.) are pinned explicitly in [tools] below.

[settings]
color = true
experimental = true
idiomatic_version_file = true
idiomatic_version_file_enable_tools = []
legacy_version_file = false
lockfile = true
not_found_auto_install = true
python.uv_venv_auto = "create|source"
quiet = true
### Debug
#verbose = true
#log_level = "debug"

[env]
ARCH = "{{exec(command='uname -m')}}"
# No GITHUB_TOKEN here. `{{env.GITHUB_TOKEN | default(value='')}}` assigned the
# variable to itself when set -- a no-op -- and to the EMPTY STRING when not,
# which is the damaging case: mise resolves a github.com token from
# MISE_GITHUB_TOKEN, then GITHUB_API_TOKEN, then GITHUB_TOKEN, first one found
# winning (https://mise.jdx.dev/dev-tools/github-tokens.html). An empty
# GITHUB_TOKEN still occupies that third slot, shadowing the credential-command,
# OAuth and git-credential sources below it, so mise fell back to unauthenticated
# rate-limited API calls. Omitted, an ambient token passes through untouched and
# the fallbacks stay reachable. Set MISE_GITHUB_TOKEN to authenticate mise itself
# -- slot 1, so nothing can shadow it.
PROJECT_NAME = "{{exec(command='basename $(git config --get remote.origin.url) .git || {{ config_root }}')}}"
RUST_COVERAGE_THRESHOLD = "100"
_.file = ".env"

[tools]
# rust is provisioned from rust-toolchain.toml via [settings] above — no version
# is repeated here, keeping rust-toolchain.toml the single source of truth.
"cargo:cargo-audit" = { version = "latest" }
"cargo:cargo-crap" = { version = "latest" }
"cargo:cargo-criterion" = { version = "latest" }
"cargo:cargo-deny" = { version = "latest" }
"cargo:cargo-edit" = { version = "latest" }
"cargo:cargo-fuzz" = { version = "latest" }
"cargo:cargo-machete" = { version = "latest" }
"cargo:cargo-mutants" = { version = "latest" }
"cargo:cargo-nextest" = { version = "latest" }
"cargo:cargo-pgo" = { version = "latest" }
"cargo:cargo-semver-checks" = { version = "latest" }
"cargo:cargo-sort" = { version = "latest" }
"cargo:cargo-tarpaulin" = { version = "latest" }
"cargo:cargo-update" = { version = "latest" }
"cargo:cargo-wizard" = { version = "latest" }
"cargo:committed" = { version = "latest" }
"cargo:flamegraph" = { version = "latest" }
"cargo:rumdl" = { version = "latest" }
"cargo:taplo-cli" = { version = "latest" }
"cargo:yamllint-rs" = { version = "latest" }

# comply is deliberately NOT here, for the same reason as ignorefile below.
#
# It is a git-source install, and cargo-binstall cannot serve one: comply is on
# crates.io only as semver prereleases (0.0.1-1, 0.1.0-9), which `cargo install`
# skips, and its GitHub releases publish no binary assets. Every `mise install`
# therefore compiled it from source -- roughly 3.5 minutes, in EVERY job of every
# run. Run 30706537351 spent 7m19s in `mise install --locked` and was cancelled
# still compiling.
#
# `.github/actions/setup-rust-env` installs it once instead, pinned to a rev and
# guarded by the ~/.cargo/bin cache, so it is built on a cache miss rather than
# on every job. Local developers get it from `mise run comply:install`.

# Python
"pipx:codecov-cli" = { version = "latest" }

# Binaries registries or from sources if architecture is not supported
"aqua:hk" = { version = "latest", os = [
  "linux",
  "windows",
  "macos/arm64",
], arch = [
  "arm64",
  "x64",
], locked = false }

# Binaries from mise registries:
actionlint = { version = "latest" }
git-cliff = { version = "latest" }
gitleaks = { version = "latest" }
# ignorefile is deliberately NOT here. Its three binaries live in one git
# workspace and none is on crates.io yet, and mise's cargo backend cannot pass a
# package selector to `cargo install --git` -- it emits a bare
# `cargo install --git=<url>`, which cargo rejects with "multiple packages with
# binaries found". Both `bin` and `crate` are ignored. `mise run
# ignorefile:install` does it instead; move it here once the crates publish.
scorecard = { version = "latest" }
taplo = { version = "latest" }

[hooks]
enter = { task = "setup" }
postinstall = '''
echo "Installed: $MISE_INSTALLED_TOOLS"
'''

# No `[deps.bun] auto = true`. `auto` runs `bun install` before EVERY task, the
# Rust gates included, and the CI container provisions no bun -- so the coverage
# job dies before it starts with "failed to execute command: bun install / No
# such file or directory". Moving package.json back under `docs/` did NOT fix
# this: the dependency is declared here, not inferred from where a manifest sits,
# so it fires regardless. It is also invisible on a developer machine that has
# bun on PATH, which is why it reads as harmless until CI runs.
#
# It contradicts the note above the docs tasks besides -- a broken docs build
# must not fail the crate gate. The three tasks that need the dependencies
# (`docs:install`, `docs:build`, `docs:typecheck`) each run `bun install`
# themselves and set `dir = "docs"`, so nothing is lost by leaving it out.

[deps.cargo]
auto = true

[deps.gh]
auto = true

[tasks."act:setup"]
alias = []
description = "Create the .act/ scratch files .actrc points at (idempotent)"
hide = true
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# `if` blocks, not `[ ! -f x ] && cmd`: as the final statement that idiom makes
# the whole task exit 1 once the file exists, which broke every run after the
# first -- and `act` depends on this task, so `mise run act` never started.
mkdir -p .act/

if [ ! -f ".act/README.md" ]; then
  cat <<-'README' > ".act/README.md"
# [Nektos/ACT](https://nektosact.com)

This folder must not have any file commited except this README.md
README
fi

# .actrc passes --secret-file/--var-file/--eventpath unconditionally, so act
# aborts if any of these is absent. .secrets holds a live token at run time and
# is created 0600 here so it is never briefly world-readable.
for f in .act/.vars .act/.env; do
  [ -f "$f" ] || touch "$f"
done

# act 0.2.89's artifact server implements an older revision of the v4 artifact
# protocol: it rejects the `mime_type` field upload-artifact v7 sends, the
# request body fails to decode, and the step burns five retries before failing a
# run that otherwise passed. There is no newer act to upgrade to and no per-step
# skip flag, so the workflow reads this variable and act supplies it here.
#
# Appended rather than written, and guarded on the key rather than the file, so
# a .vars the developer has added their own entries to survives, and a second
# run does not add a duplicate line.
if ! grep -q '^UPLOAD_ARTIFACTS=' .act/.vars 2>/dev/null; then
  echo "UPLOAD_ARTIFACTS=false" >> .act/.vars
fi

# The act-only checkout in .github/workflows/tests/*.yml is gated on
# `vars.ACT == 'true'`, and nothing was writing it -- so `vars.ACT` was always
# empty, the `!= 'true'` branch always won, and act ran the REAL
# actions/checkout: a network fetch of `github.ref` that dies with
# `upload-pack: not our ref` on any commit not pushed yet, which is every commit
# worth testing locally. act's own ACT=true env var is not visible to `vars.*`
# (that namespace is fed exclusively by --var-file), so it has to be set here.
#
# Same guarded append as above: a developer's own .vars entries survive, and a
# second run does not duplicate the line.
if ! grep -q '^ACT=' .act/.vars 2>/dev/null; then
  echo "ACT=true" >> .act/.vars
fi

if [ ! -f ".act/.secrets" ]; then
  touch .act/.secrets
  chmod 600 .act/.secrets
fi
# A populated repository stanza, not `{}`: third-party actions read
# `payload.repository.owner` and die with "Cannot read properties of undefined"
# on an empty event, which is what made the Secrets Scan job unrunnable locally.
# Owner/name come from the git remote so the payload matches the real repo.
if [ ! -f ".act/event.json" ]; then
    # Parameter expansion, not sed: BSD sed has no lazy quantifier, so an ERE
    # that works on GNU fails on macOS with "repetition-operator operand invalid".
    slug=$(git remote get-url origin 2>/dev/null || true)
    slug=${slug%.git}
    slug=${slug#*://}
    slug=${slug#*@}
    slug=${slug#*:}
    name=${slug##*/}
    owner=${slug%/*}
    owner=${owner##*/}
    : "${owner:=local}"
    : "${name:=$(basename "$PWD")}"
    sha=$(git rev-parse HEAD 2>/dev/null || echo 0000000000000000000000000000000000000000)
    branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo main)
    # `commits` and `ref` matter as much as `repository`: a push-event consumer
    # reads `eventJSON.commits.length` and dies on an empty object.
    printf '%s\n' \
      '{' \
      "  \"ref\": \"refs/heads/$branch\"," \
      "  \"before\": \"$sha\"," \
      "  \"after\": \"$sha\"," \
      "  \"commits\": [ { \"id\": \"$sha\" } ]," \
      '  "repository": {' \
      "    \"name\": \"$name\"," \
      "    \"full_name\": \"$owner/$name\"," \
      "    \"default_branch\": \"$branch\"," \
      '    "private": false,' \
      "    \"owner\": { \"login\": \"$owner\", \"name\": \"$owner\" }" \
      '  }' \
      '}' > .act/event.json
fi
'''

[tasks.act]
alias = []
depends = ["act:setup"]
description = "Run a workflow locally with Nektos/act, e.g. `mise run act -w ci -j formatting`"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# Was `-W .github/workflows/tests/<name>.yml`, a path copied from another repo
# that does not exist here, so every invocation failed on a missing file.
workflow=".github/workflows/${usage_workflow?}.yml"
if [ ! -f "$workflow" ]; then
  echo "No such workflow: $workflow" >&2
  echo "Available:" >&2
  basename -s .yml .github/workflows/*.yml | sed 's/^/  /' >&2
  exit 1
fi

gh auth token > /dev/null 2>&1 || { echo "gh is not authenticated; run: gh auth login" >&2; exit 1; }

# The token reaches act through the ENVIRONMENT: `-s NAME` with no value makes
# act read NAME from the environment instead of taking it inline.
#
# It was `-s "GITHUB_TOKEN=$(gh auth token)"`, which put the token in argv, and
# argv is world-readable -- `ps` printed the live `gho_...` to every process on
# the machine for as long as the run lasted. A file is not the alternative
# either: gitleaks does not read .gitignore, so `gitleaks dir` flagged
# .act/.secrets as a real leak, and act copies the whole working tree into the
# container. .actrc still requires that file to exist, so act:setup leaves it
# empty. The environment is the one channel that is neither world-readable nor
# on disk.
# .actrc hardcodes --container-daemon-socket=/var/run/docker.sock, which exists
# only for some runtimes -- under Docker Desktop or colima on macOS the socket
# lives elsewhere, and act then fails with "no such file or directory" before it
# runs a single step. Resolve the endpoint the docker CLI is actually using, and
# fall back to the first context that answers.
socket="${DOCKER_HOST:-}"
if [ -z "$socket" ]; then
    socket=$(docker context inspect 2>/dev/null | jq -r '.[0].Endpoints.docker.Host // empty')
fi
if [ -z "$socket" ] || ! docker --host "$socket" info >/dev/null 2>&1; then
    for candidate in $(docker context ls --format json 2>/dev/null | jq -r '.DockerEndpoint // empty'); do
        if docker --host "$candidate" info >/dev/null 2>&1; then
            socket="$candidate"
            break
        fi
    done
fi
if [ -z "$socket" ] || ! docker --host "$socket" info >/dev/null 2>&1; then
    echo "No reachable Docker daemon. Start Docker Desktop or run: colima start" >&2
    exit 1
fi
echo "Using Docker daemon at $socket"

# .actrc passes --detect-event, which picks `pull_request` for a workflow that
# declares both triggers. Locally there is no PR, so actions that query the PR
# API call `/pulls//commits` with an empty number and 404. A working tree is a
# push, so select that explicitly whenever the workflow accepts one.
event=()
if grep -qE '^[[:space:]]*push:' "$workflow"; then
    event=(push)
fi

args=("${event[@]}" -W "$workflow" -s GITHUB_TOKEN)
# `-` disables bind-mounting the socket into the job container. act mounts it by
# default so a workflow can talk to Docker, which none of these do -- and under
# colima the socket lives inside a VM, so the mount fails outright with
# "operation not supported". DOCKER_HOST below is what act itself connects on.
args+=(--container-daemon-socket -)
[ -n "${usage_job:-}" ] && args+=(-j "$usage_job")
# Assigned on the command as a prefix, so the value lands in act's environment
# and never in its argv. mise.toml's [env] exports GITHUB_TOKEN as the empty
# string when nothing is set, so it has to be assigned HERE rather than relied on
# -- an empty value would make act prompt for the secret and hang the run.
GITHUB_TOKEN="$(gh auth token)" DOCKER_HOST="$socket" act "${args[@]}"
'''
usage = '''
flag "-w --workflow <workflow>" help="Workflow basename under .github/workflows" default="ci" env="ACT_WORKFLOW"
flag "-j --job <job>" help="Single job id to run; omit to run the whole workflow" env="ACT_JOB"
'''

[tasks.all]
alias = []
description = "Run all local development tasks"
hide = true
run = '''
mise lock
mise run ci:fix
mise run build:install
mise run git:amend:push:force
'''

[tasks."git:ignore:check"]
alias = ["gitignore", "ignore:check"]
