[tasks.comply]
alias = []
description = "Check REUSE/SPDX license compliance with comply (defaults to `lint`); pass a subcommand, e.g. `mise run comply annotate --license MIT --holder \"Name <email>\"`"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# Variadic args arrive as a shell-escaped string; eval into an array so flags
# survive intact. Fall back to `lint` (the CI gate) when nothing is passed.
eval "args=(${usage_args:-lint})"
# ALWAYS build from this workspace. An installed `comply` on PATH would make the
# gate report on whatever binary happened to be installed rather than on the code
# being changed -- a green check for a tree that does not pass.
comply "${args[@]}"
'''
shell = "bash -c"
usage = 'arg "[args]" var=#true help="comply subcommand + flags; defaults to `lint` when omitted"'

[tasks."comply:fix"]
alias = []
description = "Add/refresh SPDX headers on source files with `comply annotate` (the WRITE counterpart to the lint-only `comply` task). Requires explicit paths — it never blanket-annotates, since most files are covered aggregately by REUSE.toml's `**` rule"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# `comply lint` only CHECKS; this is the writer. Paths are required on purpose:
# REUSE.toml's `**` aggregate annotation already makes every file compliant, so
# headers are an opt-in per-file convention (used on source files), not a blanket
# operation. Pass `--copyright` WITHOUT a year — comply prepends the current year
# itself, so embedding one would double it ("2026 2026 …"). --merge-copyrights
# keeps re-runs idempotent (no duplicate copyright lines).
# `<paths>` is declared required in the usage spec below, so mise rejects an
# empty invocation with a proper CLI error before this script ever runs.
eval "paths=(${usage_paths:-})"
# Never annotate symlinks — the per-crate LICENSE-APACHE/LICENSE-MIT links point
# at the shared LICENSES/ texts, so `comply annotate` would write THROUGH the link
# (corrupting the canonical license) or drop a `.license` sidecar. Filter them out
# (defence-in-depth; the *.rs scope already excludes the license links).
real=()
for p in "${paths[@]}"; do
    if [ -L "$p" ]; then
        echo "comply:fix: skipping symlink $p" >&2
    else
        real+=("$p")
    fi
done
# Joined-string test, not `${#real[@]}`: mise renders run blocks as tera
# templates and bash's array-length syntax opens a tera comment (`{#`), failing
# the task with "Closing comment tag `#}` not found". Paths are never empty
# strings, so the two tests agree here.
if [ -z "${real[*]:-}" ]; then
    exit 0
fi
# Built from this workspace for the same reason as [tasks.comply]: an installed
# binary would write headers using a different version of the tool than the one
# under change.
# --update-reuse-toml false is now the CLI default too; it stays spelled out
# here so this task's behaviour is pinned regardless of any future default
# change. The `**` aggregate in REUSE.toml already covers these files, so a
# per-file `override` block adds nothing -- and `override` would supersede the
# inline header written above.
comply annotate \
    --copyright "COMPLY contributors" \
    --license "MIT OR Apache-2.0" \
    --merge-copyrights \
    --update-reuse-toml false \
    "${real[@]}"
# `annotate` writes header CONTENT but leaves the shape of a header that already
# exists; only `format` canonicalises shape. Running both is what makes this task
# agree with `comply:format:check` by construction -- annotate for files with no
# header, format for the ones that have a non-canonical one.
#
# An earlier awk pass here did the opposite: it deleted the bare comment marker
# between the copyright and licence lines. Because hk runs this task as a
# pre-commit FIX step on every staged *.rs, each commit silently reverted the
# canonical form, and `comply:format:check` then failed in CI on files that had
# just been "fixed".
# `--files` takes ONE value per occurrence, so the flag is repeated rather than
# handed a list; `--files a.rs b.rs` makes clap reject b.rs as a stray argument.
fmt_args=()
for p in "${real[@]}"; do
    fmt_args+=(--files "$p")
done
comply format "${fmt_args[@]}"
'''
shell = "bash -c"
usage = 'arg "<paths>" var=#true help="files to annotate, e.g. crates/foo/src/lib.rs"'

[tasks."comply:fix:all"]
alias = []
description = "Whole-project SPDX header pass: run comply:fix over EVERY tracked Rust source file. Idempotent (existing 2-line headers are left byte-identical), so it's safe to run anytime"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

files=()
while IFS= read -r f; do files+=("$f"); done < <(git ls-files '*.rs')
if [ -z "${files[*]:-}" ]; then
    echo "comply:fix:all: no tracked .rs files found." >&2
    exit 0
fi
mise run comply:fix "${files[@]}"
'''
shell = "bash -c"

