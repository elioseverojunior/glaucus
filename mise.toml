[tasks."doc:open"]
alias = ["do", "dh", "doc:html"]
depends = ["doc"]
description = "Open the API docs `doc` built in the default browser (macOS, Linux or Windows)"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

page="target/doc/glaucus/index.html"

# Dispatched on `uname`, not on which opener happens to be installed. Probing for
# `open` first would be wrong on Linux, where it is an unrelated command on some
# distributions (and absent on most), so a probe order that works on macOS
# misfires there. $BROWSER comes first regardless: it is what headless boxes and
# remote-SSH sessions set, and it is the only correct answer when there is no
# local display to open anything on.
if [ -n "${BROWSER:-}" ]; then
    "${BROWSER}" "${page}"
else
    case "$(uname -s)" in
        Darwin) open "${page}" ;;
        Linux) xdg-open "${page}" ;;
        # `start` is a cmd builtin rather than an executable, so it cannot be
        # invoked directly from bash. The empty "" is the window TITLE argument,
        # which start would otherwise take the path for. `//c` survives MSYS
        # path mangling, which rewrites a lone `/c` into a Windows path.
        MINGW* | MSYS* | CYGWIN*) cmd.exe //c start "" "${page}" ;;
        *)
            echo "doc:open: no known opener for $(uname -s). Docs are at ${page}" >&2
            exit 1
            ;;
    esac
fi
'''
shell = "bash -c"

[tasks."cargo:lock:check"]
alias = []
description = "Fail if Cargo.lock is out of date relative to Cargo.toml (run `cargo update` to refresh)"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# Judges the INDEX, not the working tree, because the working tree is not stable
# while the hook runs: `audit` and `deny` invoke cargo, and cargo repairs a stale
# Cargo.lock in place. A working-tree check read a file an earlier step had
# already fixed and passed, while the STAGED lock stayed stale and went into the
# commit -- the exact thing this exists to stop. Materialising the index removes
# the ordering dependency: the verdict cannot be changed by whatever else ran.
#
# `--locked` on a read-only command, not `cargo update --dry-run`. It fails when
# the lock would have to change and never writes, so there is no repaired file
# for a later step to observe. It also avoids the trap the previous version fell
# into: `cargo update --dry-run | grep -q` closed the pipe at the first match,
# and cargo -- Rust ignores SIGPIPE -- then died on EPIPE with 101, which
# `pipefail` promoted to the pipeline's status, leaving the `if` false precisely
# when the lockfile WAS stale. It could never fail.
if ! git rev-parse --git-dir >/dev/null 2>&1; then
    echo "cargo:lock:check: not a git repository, nothing staged to judge." >&2
    exit 0
fi

staged="$(mktemp -d)"
trap 'rm -rf "${staged}"' EXIT
git checkout-index --all --prefix="${staged}/"

if ! report="$(cargo metadata --locked --format-version 1 \
    --manifest-path "${staged}/Cargo.toml" 2>&1 >/dev/null)"; then
    echo "Cargo.lock is out of date as staged -- run 'cargo update', then stage it." >&2
    # Rewritten to repo-relative: cargo names the scratch copy it was pointed at,
    # and a /var/folders/... path in the message reads as a different file.
    printf '%s\n' "${report}" | sed "s|${staged}/||g" >&2
    exit 1
fi
'''
shell = "bash -c"

