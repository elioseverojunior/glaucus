# -- Branch Protection --
[tasks."gh:branch:protect"]
alias = ["bp"]
description = "Apply branch protection rules to the default branch (force-push allowed for admins, required CI/Mise, require PR reviews). Pass --check to report the current rules without writing"
hide = true
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# Repo and branch are RESOLVED, not hardcoded. This read `repos/elioseverojunior/
# glaucus/branches/main/protection` literally, so running it from a fork -- or
# after a rename -- rewrote protection on the upstream repository instead of the
# one checked out, silently and with admin rights. `gh:env:protect` resolves the
# same way; keep them consistent.
repo="$(gh repo view --json nameWithOwner -q .nameWithOwner)"
branch="$(gh repo view --json defaultBranchRef -q .defaultBranchRef.name)"

if [ "${usage_check:-false}" = true ]; then
    echo "repo: ${repo}   default branch: ${branch}"
    gh api "repos/${repo}/branches/${branch}/protection" \
        -q '{required_status_checks: (.required_status_checks.contexts // []),
             enforce_admins: .enforce_admins.enabled,
             required_reviews: (.required_pull_request_reviews != null),
             required_signatures: .required_signatures.enabled,
             linear_history: .required_linear_history.enabled}' 2>/dev/null \
        || echo "  no protection configured"
    exit 0
fi

# Apply branch protection with admin bypass
GH_PAGER= gh api -X PUT "repos/${repo}/branches/${branch}/protection" \
  --input - << 'EOF'
{
    "required_status_checks": {
        "strict": true,
        "contexts": [
            "CI",
            "Mise"
        ]
    },
    "enforce_admins": false,
    "required_pull_request_reviews": {
        "dismiss_stale_reviews": true,
        "require_code_owner_reviews": true,
        "required_approving_review_count": 1
    },
    "required_signatures": true,
    "required_linear_history": true,
    "allow_force_pushes": true,
    "allow_deletions": false,
    "block_creations": false,
    "required_conversation_resolution": true,
    "lock_branch": false,
    "allow_fork_syncing": false,
    "restrictions": null
}
EOF

echo "Branch protection applied to ${branch} on ${repo}"
'''
shell = "bash -c"
usage = 'flag "--check" help="report the current rules without writing"'

[tasks."gh:env:protect"]
alias = ["ep"]
description = "Apply deployment-environment protection to crates-io (required reviewer + protected branches) and github-pages (branch policy). Idempotent; pass --check to report drift without writing"
hide = true
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# Environment protection is the ONLY thing narrowing crates.io Trusted
# Publishing. crates.io matches the OIDC `workflow_ref` claim, which for a
# reusable workflow is the CALLER -- publish.yml runs as a called workflow, so
# the registered filename is `cicd.yml` and the grant covers any job in it. The
# `crates-io` environment is what brings that back to "a human approved this,
# from a protected branch".
repo="$(gh repo view --json nameWithOwner -q .nameWithOwner)"
checking="${usage_check:-false}"

# The reviewer is resolved, not hardcoded: `gh:branch:protect` above hardcodes
# elioseverojunior/glaucus and silently targets the wrong repository from a fork.
reviewer_login="$(gh api user -q .login)"
reviewer_id="$(gh api user -q .id)"

# `prevent_self_review` stays FALSE deliberately. With a single reviewer it would
# make every deployment unapprovable -- the one person who can approve is the one
# who triggered it -- and publishing would block forever. Set it true only once a
# second reviewer exists.
crates_io=$(cat <<EOF
{
  "wait_timer": 0,
  "prevent_self_review": false,
  "reviewers": [{ "type": "User", "id": ${reviewer_id} }],
  "deployment_branch_policy": { "protected_branches": true, "custom_branch_policies": false }
}
EOF
)

# github-pages gets a branch policy but NO required reviewer. The docs site
# publishes on every release; an approval prompt there buys nothing and would
# stall an otherwise unattended pipeline. `custom_branch_policies` rather than
# `protected_branches` because `gh-pages` is a deploy target, not a protected
# branch, and peaceiris/actions-gh-pages pushes to it directly.
github_pages=$(cat <<'EOF'
{
  "wait_timer": 0,
  "deployment_branch_policy": { "protected_branches": false, "custom_branch_policies": true }
}
EOF
)

show() {
    gh api "repos/${repo}/environments/$1" \
        -q '{name, rules: [.protection_rules[]?.type], branch_policy: .deployment_branch_policy}' 2>/dev/null \
        || echo "  $1: does not exist"
}

if [ "$checking" = true ]; then
    echo "repo: ${repo}   reviewer: ${reviewer_login} (${reviewer_id})"
    for env in crates-io github-pages; do show "$env"; done
    exit 0
fi

printf '%s' "${crates_io}" | GH_PAGER= gh api -X PUT "repos/${repo}/environments/crates-io" --input - >/dev/null
echo "crates-io: required reviewer ${reviewer_login}, protected branches only"

printf '%s' "${github_pages}" | GH_PAGER= gh api -X PUT "repos/${repo}/environments/github-pages" --input - >/dev/null
# PUT resets custom branch policies, so they are re-declared here rather than
# assumed to survive. `gh-pages` is the deploy branch; `main` is what dispatches.
for branch in gh-pages main; do
    GH_PAGER= gh api -X POST "repos/${repo}/environments/github-pages/deployment-branch-policies" \
        -f "name=${branch}" -f "type=branch" >/dev/null 2>&1 || true
done
echo "github-pages: branch policy (gh-pages, main), no reviewer required"
'''
shell = "bash -c"
usage = 'flag "--check" help="report the current rules without writing"'

