[tasks."fuzz:all"]
alias = []
description = "Run every cargo-fuzz target sequentially (FUZZ_TIME seconds each, default 60). Requires nightly — see `mise run rustup:nightly`. Skips cleanly when no fuzz/ targets exist"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# Mirror the single-target `fuzz` task's guard: no fuzz/ directory means no
# targets, so skip cleanly. Otherwise discover targets dynamically (so this
# never drifts from fuzz_targets/) and fuzz each for FUZZ_TIME seconds.
# `crates/comply-fuzz` until now, which never existed -- so this skipped
# unconditionally while the `fuzz` task looked at `fuzz/`. cargo-fuzz's own
# convention is `fuzz/` beside the workspace root, which is where the targets
# actually live.
if [ ! -d fuzz ]; then
    echo "fuzz:all: skipping — no fuzz/ directory (no targets yet)." >&2
    exit 0
fi
time_budget="${FUZZ_TIME:-60}"
# `--target` is NOT optional. cargo-fuzz bakes its default triple in at ITS OWN
# build time, so the value describes how the binary was produced, not the machine
# running it -- and cargo-binstall (which mise's `cargo:` backend shells out to)
# serves the statically linked build. On a gnu Linux host that retargets the
# build to x86_64-unknown-linux-musl and fails twice over: "sanitizer is
# incompatible with statically linked libc" (musl enables crt-static by default)
# and "can't find crate for `core`" (no musl std installed). It is invisible on
# macOS, where the downloaded binary's triple happens to match the host.
host="$(rustc +nightly -vV | awk '/^host:/{print $2}')"
for target in $(cargo +nightly fuzz list); do
  echo "▶ fuzzing ${target} for ${time_budget}s on ${host}"
  cargo +nightly fuzz run "$target" --target "$host" -- -max_total_time="$time_budget"
done
'''
shell = "bash -c"

