[tasks.changelog]
alias = ["cliff", "changelog:build", "changelog:preview", "changelog:release"]
description = "Regenerate CHANGELOG.md from the commit history with git-cliff (config in cliff.toml). Never hand-edit CHANGELOG.md"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail
if [ "${usage_verbose:-false}" = "true" ]; then set -x; fi

# THE one git-cliff invocation in this repository. It was six -- four
# `changelog:*` tasks plus two raw calls inside `release:prepare` -- so the
# tool, its config path and its range selectors lived in places free to drift,
# while CI built release bodies with `gh --generate-notes`, a different
# renderer entirely. Every caller now comes through these flags.
#
# `changelog:bump` is deliberately NOT carried over, and its absence is the
# point. `git cliff --bump` runs its own conventional-commit inference and
# disagrees with GitVersion on this history: cliff reads the `v0.0.1-1`
# prerelease tag and advances its prerelease counter, missing the `feat:` minor
# bump GitVersion resolves. GitVersion is what version.yml and publish.yml act
# on, so a cliff-inferred number would put a heading and a tag under a version
# the release pipeline never produces. `release:prepare` is the supported path.
#
# Plain `if` blocks rather than `[ ... ] && args+=(...)`: under `set -e` an
# AND-OR list whose test fails returns 1 as a statement and kills the task, so
# the terse form would abort the moment any flag was left off.
args=()
if [ -n "${usage_tag:-}" ]; then args+=(--tag "$usage_tag"); fi
if [ "${usage_unreleased:-false}" = "true" ]; then args+=(--unreleased); fi
if [ "${usage_latest:-false}" = "true" ]; then args+=(--latest); fi
if [ -n "${usage_strip:-}" ]; then args+=(--strip "$usage_strip"); fi

# `--stdout` wins over `--output` so a preview can never overwrite the file by
# accident; git-cliff treats the two as mutually exclusive.
if [ "${usage_stdout:-false}" = "true" ]; then
    git cliff "${args[@]}"
else
    git cliff "${args[@]}" --output "${usage_output:-CHANGELOG.md}"
fi
'''
shell = "bash -c"
usage = '''
flag "-v --verbose" help="Trace each command before running it (set -x)"
flag "-t --tag <tag>" help="Render unreleased commits under this version instead of [Unreleased], e.g. v0.1.0-1"
flag "--stdout" help="Print to stdout instead of writing the file (pair with --tag to preview a release)"
flag "--unreleased" help="Emit only the commits since the last tag"
flag "--latest" help="Emit only the most recent release section -- a GitHub release body, not the full history"
flag "--strip <part>" help="Drop part of the rendered output: header, footer or all"
flag "-o --output <path>" help="Write somewhere other than CHANGELOG.md, e.g. RELEASE_NOTES.md"
'''

# The whole bump in one place: compute the next version, write it everywhere,
# and render the changelog under that heading.
#
# GitVersion is the sole authority. `git cliff --bump` is the tempting
# alternative and it is wrong here: it runs its own conventional-commit
# inference, and on this history the two disagree outright -- cliff reads the
# `v0.0.1-1` prerelease tag and advances its prerelease counter to `v0.0.1-1.1`,
# missing the `feat:` minor bump that GitVersion resolves to `0.1.0`. Since
# GitVersion is what `.github/workflows/version.yml` and `publish.yml` act on,
# a cliff-inferred version would put a changelog heading and a git tag under a
# number the release pipeline never produces. That is why the `changelog` task
# exposes no `--bump` flag.
#
# Neither commits nor tags. `version:tag` cuts the tag, and the commit needs the
# per-action approval every commit here needs.
[tasks."release:prepare"]
alias = ["rp"]
description = "Compute the next version from GitVersion, write it into every file that restates it, and regenerate CHANGELOG.md under that heading. --check previews without writing"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

checking="${usage_check:-false}"

version="$(mise run version:json | jq -r '.SemVer // empty')"
if [ -z "$version" ]; then
    echo "release:prepare: gitversion produced no SemVer; is it installed?" >&2
    exit 1
fi

# Refuse a version cliff.toml would not recognise as a release. `--tag` BYPASSES
# `tag_pattern`, so without this the heading renders happily now and the tag is
# silently ignored later -- the section reappears as [Unreleased] on the next
# regeneration, with nothing to explain why. Off the default branch GitVersion
# labels with the branch name (0.1.0-my-branch.1), which `tag_pattern`
# (`^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+.*)?$`) does not accept.
#
# A hard error only when WRITING. `--check` is the preview path and previewing
# from a feature branch is legitimate, so there it warns and carries on.
if ! printf '%s' "v${version}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+.*)?$'; then
    if [ "$checking" = true ]; then
        printf 'warning: v%s is not a release-shaped version; cliff.toml would ignore this tag.\n' "$version" >&2
        printf '         Previewing anyway -- cut the real release from the default branch.\n\n' >&2
    else
        printf 'release:prepare: refusing v%s -- cliff.toml tag_pattern would not treat it as a release.\n' "$version" >&2
        printf '                 GitVersion labels non-default branches with the branch name; cut this\n' >&2
        printf '                 from the default branch, or use --check to preview.\n' >&2
        exit 1
    fi
fi

if [ "$checking" = true ]; then
    printf 'next version: %s (currently %s)\n\n' \
        "$version" "$(taplo get -f Cargo.toml '.workspace.package.version')"
    # Drift is the EXPECTED state in a preview, so the non-zero exit must not
    # stop the changelog below, and neither mise's "ERROR task failed" nor the
    # "run version:sync" hint belongs here -- the command to run is this one.
    mise run version:sync --from-git --check 2>&1 \
        | grep -vE 'ERROR task failed|Run .mise run version:sync' || true
    printf '\n--- CHANGELOG.md entries for v%s ---\n' "$version"
    mise run changelog --unreleased --stdout --tag "v${version}"
    exit 0
fi

mise run version:sync --from-git
mise run changelog --tag "v${version}"
printf 'release prepared: v%s -- review CHANGELOG.md, then `git commit --amend` (a NEW commit invalidates the counter) and tag\n' "$version"
'''
shell = "bash -c"
usage = 'flag "--check" help="preview the computed version and changelog entries without writing"'

# -- crates.io registry state --

# Answers "has this NAME been taken", which is a different question from "is
# this VERSION taken" and the one that actually gates a publish. This lived in
# .github/scripts/crates-io-index.sh; it is here because mise.toml is the single
# source of truth for this project's tasks, and a workflow-only script could not
# be run locally before pushing a release.
#
# EVERYTHING HERE FAILS CLOSED. The earlier script ran `curl -sSf ... || true`,
# which collapsed 404, 500, DNS failure and timeout into the same empty output --
# so a network blip was indistinguishable from "this name is free". Only a
# definitive 404 means "not published"; any other non-200 stops the caller.
#
# TERA, NOT BASH, PARSES THIS FIRST. mise renders `run` as a Tera template, and
# `{#` opens a Tera comment -- so `${#array[@]}` fails at render time with
# "Closing comment tag `#}` not found" before bash ever sees it. That is why
# every count below is an explicit counter variable rather than an array length.
[tasks."crates:status"]
alias = ["cs", "crates:check"]
description = "Classify every publishable workspace crate on crates.io (absent / exists / version-taken) and verify ownership. Fails closed on any inconclusive lookup; prints a trailing bootstrap_needed=<bool> line for CI to consume"
dir = "{{ config_root }}"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

# Defaults to the MANIFEST version, because that is the version cargo will
# actually upload -- `cargo publish` reads Cargo.toml and ignores whatever a
# release pipeline computed. GitVersion and Cargo.toml drift routinely (CI warns
# "Cargo.toml declares X but this run resolved Y"), and checking the resolved
# version while cargo uploads the manifest one asks about a release that does not
# exist: every crate reads "available", then cargo fails on the duplicates.
version="${usage_version:-$(cargo metadata --no-deps --format-version 1 \
    | jq -r '[.packages[] | select(.publish != []) | .version] | first // empty')}"
: "${version:?could not determine a version to check}"
verify="${usage_verify:-false}"
owner="${usage_owner:-$(git config --get remote.origin.url | sed -E 's#.*[:/]([^/]+)/[^/]+$#\1#')}"

ua="glaucus-publish-workflow (+https://github.com/${owner}/glaucus)"
body="$(mktemp)"
trap 'rm -f "$body"' EXIT

# Writes the response body to $body and prints the HTTP status. `|| code=000`
# REASSIGNS on transport failure rather than appending to curl's own "000"
# output, which would otherwise produce a garbled "HTTP 000000".
#
# --retry-all-errors is what makes retrying useful: without it curl retries only
# transient transport errors, not the 5xx crates.io returns while shedding load.
probe() {
    local code
    code="$(curl -sL --retry 3 --retry-delay 2 --retry-all-errors --max-time 30 \
        -H "User-Agent: $ua" -o "$body" -w '%{http_code}' "$1")" || code=000
    printf '%s' "$code"
}

# crates.io shards the index by name length: 1/a, 2/ab, 3/a/abc, then ab/cd/abcd.
#
# The length comes from `wc -c`, not from the obvious parameter expansion: that
# spelling opens with the brace-hash pair Tera reads as a comment, and would fail
# this task at render time. See the note above the task.
index_url() {
    local name="$1" path len
    len="$(printf '%s' "$name" | wc -c | tr -d ' ')"
    case "$len" in
    1) path="1/$name" ;;
    2) path="2/$name" ;;
    3) path="3/${name:0:1}/$name" ;;
    *) path="${name:0:2}/${name:2:2}/$name" ;;
    esac
    printf 'https://index.crates.io/%s' "$path"
}

# `publish` is null for publishable crates and [] for `publish = false`, so this
# never sends a dev-only harness to the registry.
members="$(cargo metadata --no-deps --format-version 1 \
    | jq -r '.packages[] | select(.publish != []) | .name' | sort)"

absent=""
taken=""
foreign=""
pending=""
todo=""
n_absent=0
n_taken=0
n_foreign=0
n_pending=0
n_todo=0
n_total=0

for crate in $members; do
    n_total=$((n_total + 1))

    code="$(probe "$(index_url "$crate")")"

    case "$code" in
    404) state=absent ;;
    200)
        if jq -r '.vers' <"$body" | grep -Fxq "$version"; then
            state=version-taken
        else
            state=exists
        fi
        ;;
    *)
        echo "error: crates.io index returned HTTP $code for '$crate'" >&2
        echo "       cannot confirm publish state; refusing to guess" >&2
        exit 1
        ;;
    esac

    # Post-publish mode asks the opposite question: everything should now be
    # present at this version, and anything missing is merely not indexed yet.
    if [ "$verify" = true ]; then
        if [ "$state" = version-taken ]; then
            echo "  OK      $crate $version -- https://crates.io/crates/$crate/$version"
        else
            pending="$pending $crate"
            n_pending=$((n_pending + 1))
            echo "  PENDING $crate $version not indexed yet"
        fi
        continue
    fi

    case "$state" in
    absent)
        absent="$absent $crate"
        todo="$todo $crate"
        n_absent=$((n_absent + 1))
        n_todo=$((n_todo + 1))
        echo "  NEW     $crate does not exist on crates.io -- needs a first publish"
        ;;
    version-taken)
        taken="$taken $crate"
        n_taken=$((n_taken + 1))
        echo "  DONE    $crate $version already published"
        ;;
    exists)
        # The name resolves, so ownership decides whether it is ours to publish
        # to. A name held by another account is a hard stop: no token we hold can
        # upload to it. Teams appear in the same array as users, so a crate owned
        # only by a GitHub team is still matched.
        code="$(probe "https://crates.io/api/v1/crates/$crate/owners")"
        if [ "$code" != 200 ]; then
            echo "error: crates.io owners returned HTTP $code for '$crate'" >&2
            exit 1
        fi
        owners="$(jq -r '(.users // [])[].login' <"$body" | sort -u)"

        if printf '%s\n' "$owners" | grep -Fxqi "$owner"; then
            todo="$todo $crate"
            n_todo=$((n_todo + 1))
            echo "  OK      $crate $version available (owned by $owner)"
        else
            foreign="$foreign $crate"
            n_foreign=$((n_foreign + 1))
            echo "  FOREIGN $crate is owned by: $(printf '%s' "$owners" | tr '\n' ' ')"
        fi
        ;;
    esac
done

if [ "$n_total" -eq 0 ]; then
    echo "error: no publishable crates found" >&2
    exit 1
fi

if [ "$verify" = true ]; then
    if [ "$n_pending" -gt 0 ]; then
        echo "not yet indexed (usually transient):$pending"
    fi
    exit 0
fi

if [ "$n_foreign" -gt 0 ]; then
    echo "error: these crate names belong to another account:$foreign" >&2
    echo "       rename the crate or request ownership" >&2
    exit 1
fi

# A PARTIAL claim is resumable, not an error. crates.io rate-limits brand-new
# crates to a burst of 5 and then one per 10 minutes, so a workspace with more
# new names than that CANNOT land in a single `cargo publish` -- the run stops
# mid-way with a 429 and leaves some names claimed and some not. Treating any
# already-published version as fatal made that state unrecoverable: the retry
# refused to start precisely because the first attempt had partly succeeded.
#
# Uploads are immutable, so re-publishing a taken version is impossible anyway;
# excluding those crates and publishing the rest is the only move, and it is what
# `todo` carries. When `todo` is empty the release is simply complete, which
# keeps re-running this idempotent.
echo "taken=$(printf '%s' "$taken" | sed 's/^ //')"
echo "todo=$(printf '%s' "$todo" | sed 's/^ //')"

if [ "$n_todo" -eq 0 ]; then
    echo "nothing to publish: all $n_total crate(s) already at $version"
    echo "bootstrap_needed=false"
    exit 0
fi

if [ "$n_taken" -gt 0 ]; then
    echo "resuming a partial publish: $n_taken of $n_total already at $version"
fi

# The trailing verdict, consumed by publish.yml to choose an auth method. A crate
# that does not exist yet CANNOT have a Trusted Publishing config -- crates.io
# requires the crate to exist before one can be created -- so OIDC cannot mint a
# usable token for it and the first publish has to carry a real account token.
if [ "$n_absent" -gt 0 ]; then
    echo "first publish needed for:$absent"
    echo "bootstrap_needed=true"
else
    echo "bootstrap_needed=false"
fi
'''
shell = "bash -c"
usage = '''
flag "--version <version>" help="version to check (default: the workspace manifest version, which is what cargo publish uploads)"
flag "--verify" help="post-publish mode: confirm every crate is indexed at this version instead of gating on availability"
flag "--owner <owner>" help="expected crates.io owner login (default: the GitHub owner in remote.origin.url)"
'''

# `publish = false` gates `cargo publish` and NOTHING else. `cargo package` is a
# local build-verification command with no registry semantics, so
# `cargo package --workspace` happily packages the dev-only crates -- verified:
# a two-member sandbox where one member sets `publish = false` still reports
# "Packaging b v0.1.0", while `cargo publish --workspace --dry-run` skips it.
#
# That difference is not academic here. publish.yml packages the workspace and
# then does `cp target/package/*.crate dist/`, and dist/ is hashed, SLSA-attested,
# cosign-signed and uploaded to the GitHub release -- so the harnesses would be
# signed release artefacts. glaucus-yaml-test-suite alone contributes ~9.2k
# conformance fixtures (322K), which also made the "Package contains N files"
# size check meaningless.
#
# The set is DERIVED rather than spelled out because a hardcoded list in the
# workflow silently stops covering a fourth dev-only crate. It lives here, not in
# publish.yml, for the reason stated above `crates:status` in that file: a human
# must be able to run the exact release-time logic before cutting a release.
#
# NOT the same lever as `[workspace] exclude`. That controls MEMBERSHIP, and
# these three inherit `.workspace = true` fields, which an excluded package
# cannot resolve ("failed to find a workspace root"); pointing at the root with
# `package.workspace` fails too ("current package believes it's in a workspace
# when it's not"). Excluding them breaks `cargo bench -p glaucus-bench` and the
# manifests themselves, and buys nothing publish = false does not already give.
[tasks."crates:dev-only"]
alias = ["cdo", "crates:unpublished"]
description = "List workspace crates marked `publish = false` (bench, fuzz, conformance suite). `cargo package --workspace` ignores that flag, so release tooling must subtract this set explicitly; --flags emits ready-to-use --exclude arguments"
dir = "{{ config_root }}"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

verbose="${usage_verbose:-false}"
as_flags="${usage_flags:-false}"

# `publish` is the same tri-state `crates:status` keys off, read the other way
# round: null = publishable anywhere, [] = `publish = false`, ["name"] = allowed
# on specific registries only. The comparison is explicit because [] is TRUTHY in
# jq -- `select(.publish)` would match every crate and select nothing useful.
names="$(cargo metadata --no-deps --format-version 1 \
    | jq -r '.packages[] | select(.publish == []) | .name' | sort)"

# `grep -c .` rather than a parameter expansion: the obvious spelling for an
# array length opens with the brace-hash pair Tera parses as a comment and would
# fail this task at render time. See the note above `crates:status`.
count="$(printf '%s' "$names" | grep -c . || true)"

if [ "$verbose" = "true" ]; then
    echo "crates:dev-only: $count crate(s) marked publish = false" >&2
fi

# An empty set is a DEFECT, not "nothing to exclude". It is reachable two ways
# and both are bad: a harness lost its `publish = false` (that crate is now
# publishable and the next tag would upload it), or this query stopped matching
# cargo's metadata schema. Returning success with an empty list restores exactly
# the behaviour the task exists to prevent -- callers would package the whole
# workspace and cosign-sign the harnesses into the release -- and it would do so
# silently, at a tag, which is the worst moment to find out.
#
# Same posture `crates:status` already takes: refuse to guess on an inconclusive
# lookup. There is deliberately NO --allow-empty escape hatch. If this workspace
# genuinely has no dev-only crates left, the fix is to delete this task and its
# two call sites in publish.yml -- the subtraction they perform is then a no-op,
# and a flag would only preserve dead machinery.
if [ "$count" -eq 0 ]; then
    {
        echo 'crates:dev-only: no workspace crate declares publish = false -- refusing to continue.'
        echo '  Expected at least glaucus-bench, glaucus-fuzz and glaucus-yaml-test-suite.'
        echo '  Either a harness lost its publish = false key, or this query no longer'
        echo "  matches cargo's metadata schema. Inspect the raw values with:"
        echo '    cargo metadata --no-deps --format-version 1 | jq ".packages[] | [.name, .publish]"'
    } >&2
    exit 1
fi

if [ "$as_flags" = "true" ]; then
    # One line of `--exclude <name>` pairs, for `read -ra` in publish.yml. Safe
    # to word-split on: cargo restricts crate names to alphanumerics, `-` and `_`.
    printf '%s' "$names" | sed 's/^/--exclude /' | tr '\n' ' '
    echo
elif [ -n "$names" ]; then
    printf '%s\n' "$names"
fi
'''
shell = "bash -c"
usage = '''
flag "--flags" help="emit a single line of `--exclude <name>` arguments for cargo, instead of one bare name per line"
flag "--verbose" help="report the resolved crate count on stderr before printing"
'''

# -- comply (REUSE checker) --

# Not in [tools]: a git-source install cannot be served by cargo-binstall, so
# mise rebuilt it from source in every job. See the note in [tools] above.
# CI installs it in .github/actions/setup-rust-env; this is the local equivalent.
[tasks."comply:install"]
description = "Install the comply CLI from git (published only as prereleases, and its releases carry no binary assets)"
run = '''
cargo install --locked \
  --git https://github.com/elioseverojunior/comply \
  comply
'''

# -- Ignore file (gitignore-as-code) --

[tasks."ignorefile:install"]
alias = ["ignore:install"]
description = "Install the ignorefile CLI, LSP and MCP binaries from git (not on crates.io yet, so [tools] cannot pin them)"
run = '''
cargo install --git https://github.com/elioseverojunior/ignorefile \
  ignorefile-cli ignorefile-lsp ignorefile-mcp
'''


# `.gitignore` is generated from `ignorefile.toml`; the TOML is the source and
# the dotfile is the artifact. Editing the artifact is silently undone by the
# next `generate`, and editing the source without regenerating leaves the two
# disagreeing -- which happened: `/.playwright-mcp/` in the source had become
# two timestamped filenames that only ever matched one machine's run.

[tasks."gitignore:generate"]
alias = ["ignore:generate", "ignoregen"]
description = "Rewrite .gitignore from ignorefile.toml (the source of truth)"
run = "ignorefile generate"

[tasks."gitignore:check"]
alias = ["ignore:drift"]
description = "Drift guard: fail if .gitignore is stale vs ignorefile.toml (run by the pre-commit hook and safe to run in CI)"
run = '''
#!/usr/bin/env bash

set -Eeuo pipefail

ignorefile validate

# `generate` only writes in place, so the check is "does writing change
# anything". Compared byte-for-byte against a copy rather than with `git diff`,
# which answers a different question -- it compares against the index, so a
# staged-but-uncommitted .gitignore would read as drift when it is not.
committed="$(mktemp)"
generated="$(mktemp)"
trap 'rm -f "$committed" "$generated"' EXIT

cp .gitignore "$committed"
ignorefile generate >/dev/null
cp .gitignore "$generated"

# Restored unconditionally: `check` must never leave behind the change it is
# reporting, or it becomes indistinguishable from `generate`.
cp "$committed" .gitignore

if ! cmp -s "$committed" "$generated"; then
  echo "error: .gitignore is stale. Run \`mise run gitignore:generate\`." >&2
  diff -u --label .gitignore --label .gitignore.expected \
    "$committed" "$generated" >&2 || true
  exit 1
fi
'''
shell = "bash -c"

