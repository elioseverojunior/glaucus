name: Performance

# Per-change benchmark gate. Compares the PR/commit against the baseline
# stored on the `gh-pages` branch and fails the run on a measurable
# regression. The baseline is only updated by pushes to `main`.
#
# Security note: this workflow does not interpolate any user-controlled
# content (issue/PR titles, commit messages, head_ref, etc.) into `run:`
# steps. All `${{ }}` usages are either repo metadata in action inputs
# or conditional gates.
#
# First-time setup (one-off):
#   1. Create an empty `gh-pages` branch:
#        git checkout --orphan gh-pages && git rm -rf . && \
#        git commit --allow-empty -m "init gh-pages" && \
#        git push origin gh-pages
#   2. In repo Settings -> Pages, point Pages at the `gh-pages` branch
#      (optional -- only needed to view the historical dashboard).
#   3. In repo Settings -> Actions -> General -> Workflow permissions,
#      ensure "Read and write permissions" is enabled (required for the
#      action to push the updated baseline).

on:
  # Auto-triggers disabled: the benchmark gate is flaky on shared CI runners
  # (noisy neighbours skew timings and fail PRs on phantom regressions). Run it
  # manually via the Actions tab / `gh workflow run performance.yml` when needed.
  # push:
  #   branches: [main]
  #   paths:
  #     - "crates/glaucus-core/**"
  #     - "crates/glaucus-serde/**"
  #     - "crates/glaucus/**"
  #     - "crates/glaucus-bench/**"
  #     - "Cargo.toml"
  #     - "Cargo.lock"
  #     - ".github/workflows/performance.yml"
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - "crates/glaucus-core/**"
  #     - "crates/glaucus-serde/**"
  #     - "crates/glaucus/**"
  #     - "crates/glaucus-bench/**"
  #     - "Cargo.toml"
  #     - "Cargo.lock"
  #     - ".github/workflows/performance.yml"
  workflow_dispatch:

# Read-only at workflow scope. Every write this workflow needs is declared on
# the single job that performs it, below.
#
# The distinction is not cosmetic even with one job: a workflow-level grant is
# inherited by every job added later, so the second job to appear here would
# silently receive push access to gh-pages and comment access to pull requests
# without anyone writing that down. Declaring it per job makes the next
# contributor state the need explicitly, which is the point of least privilege.
permissions:
  contents: read

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CRITERION_HOME: ${{ github.workspace }}/target/criterion

jobs:
  benchmark:
    name: Bench vs main baseline
    runs-on: ${{ vars.RUNS_ON_ARM64 || vars.RUNS_ON || 'ubuntu-latest' }}
    # Moved here from workflow scope. A job block REPLACES the workflow default
    # rather than merging with it, so this must restate every scope the job
    # needs, `contents` included -- listing only the writes would silently drop
    # read access.
    permissions:
      contents: write # push the updated baseline to gh-pages
      pull-requests: write # post the comparison comment on PRs
      deployments: write # required by benchmark-action for environments
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-rust-env

      - name: Print runner profile
        run: |
          echo "::group::Runner profile"
          echo "CPUs: $(nproc)"
          echo "Mem:  $(free -h | awk '/Mem:/ {print $2}')"
          uname -a
          rustc --version
          echo "::endgroup::"

      - name: Reduce CPU frequency variance
        run: |
          sudo cpupower frequency-set --governor performance \
            || echo "cpupower unavailable; continuing with default governor"

      - name: Build benchmarks (warm cache, fail fast on compile errors)
        run: cargo bench -p glaucus-bench --no-run

      - name: Run benchmarks (bencher output format)
        run: |
          cargo bench -p glaucus-bench -- --output-format bencher \
            | tee bench-output.txt

      - name: Sanity-check parseable output
        run: |
          if ! grep -q "ns/iter" bench-output.txt; then
            echo "::error::No 'ns/iter' lines found in bench-output.txt."
            echo "Criterion may have failed before producing measurements."
            tail -n 50 bench-output.txt
            exit 1
          fi
          echo "Parsed $(grep -c 'ns/iter' bench-output.txt) benchmark measurements."

      - name: Compare against baseline
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: Glaucus benchmarks
          tool: cargo
          output-file-path: bench-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}

          gh-pages-branch: gh-pages
          # NOT `benchmarks`: gh-pages.yml publishes the VitePress site to the
          # root of this same branch, and the site already emits
          # benchmarks/baseline.html and benchmarks/latest.html. Sharing the
          # directory means the action's index.html and the site's pages compete
          # for the same paths -- today only `keep_files: true` on the docs
          # deploy stops data.js being swept away. Separate directory, no race.
          benchmark-data-dir-path: bench-data

          # Gated on the branch alone, NOT on `github.event_name == 'push'`.
          # The push trigger above is commented out, so event_name is always
          # `workflow_dispatch` and both flags were permanently false: the
          # baseline could never be written and every run compared against
          # nothing. Re-enabling `push:` would restore the old meaning; until
          # then a dispatch from main is what establishes the baseline.
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          save-data-file: ${{ github.ref == 'refs/heads/main' }}

          # Regression gate thresholds (ratio of current/baseline).
          #   150% -> 50% slower than baseline triggers a warning comment.
          #   200% -> 100% slower fails the job.
          alert-threshold: "150%"
          fail-threshold: "200%"
          fail-on-alert: true

          summary-always: true
          comment-on-alert: true
          alert-comment-cc-users: "@${{ github.repository_owner }}"

      # Feeds docs/benchmarks/latest.md through the VitePress data loader at
      # docs/benchmarks/results.data.ts. `--quality degraded` is the default for
      # GitHub-hosted runners on purpose: they are shared VMs whose wall-clock
      # timings vary by tens of percent, and a run can look internally healthy
      # (tight intervals) while being badly wrong in absolute terms. The page
      # renders a warning banner off that field. Pass `ok` only from a runner
      # you control and know to be quiet.
      - name: Render benchmark JSON for the docs site
        if: always()
        env:
          RUNNER_LABEL: ${{ runner.os }} / ${{ vars.RUNS_ON || 'ubuntu-latest' }}
        run: |
          set -Eeuo pipefail
          python3 scripts/bench-to-json.py bench-output.txt \
            -o docs/.data/benchmarks.json \
            --quality degraded \
            --runner "${RUNNER_LABEL}" \
            --note "Measured on a shared GitHub-hosted runner. Ratios between libraries are the figures worth reading; absolute times vary between runs and are not comparable with the curated baseline."

      # A pull request, never a push to main. Benchmark numbers from shared
      # runners need a human to look at them before they become the published
      # record -- exactly the review that would have caught the 2026-08-01 run,
      # which was internally consistent and still 4.6x-20.9x wrong. This also
      # keeps the docs deploy triggered by a normal merge rather than by a bot
      # commit that bypasses branch protection.
      - name: Open a PR with the refreshed benchmark data
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: docs/.data/benchmarks.json
          branch: bot/benchmark-data
          delete-branch: true
          commit-message: "docs(bench): refresh benchmark data from CI run"
          title: "docs(bench): refresh benchmark data"
          body: |
            Automated refresh of `docs/.data/benchmarks.json` from the
            Performance workflow. Rendered by `docs/benchmarks/latest.md`.

            Measured on a shared GitHub-hosted runner, so the run is marked
            `degraded`: read the ratios, not the absolute times, and do not copy
            these figures into `docs/benchmarks/baseline.md`.

      - name: Upload Criterion HTML reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: criterion-reports-${{ github.run_id }}
          path: target/criterion/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload bencher-format measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-output-${{ github.run_id }}
          path: bench-output.txt
          retention-days: 90
