name: Docker Release

# Grouped by tag/ref, not by workflow: a release tag is only ever built once,
# so there is nothing legitimate to cancel a second run of the SAME tag over.
concurrency:
  group: docker-release-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

# `release: published` ONLY, plus a manual escape hatch -- deliberately NOT a
# push-to-main trigger. `cicd.yml` already publishes to crates.io on every
# push to main, and a per-commit four-leg image build here would mean a new
# ghcr.io tag on every merge, for an artefact that is only ever consumed at a
# tagged release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish (e.g. v0.0.1-1). Defaults to the workspace version (from Cargo.toml) when omitted -- useful for a manual rebuild of the current commit outside a GitHub Release."
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/glaucus

# Multi-architecture delivery in three steps, the pattern Docker documents for
# distributing a build across runners:
#
#   version -> build (variant x arch, each pushed by DIGEST only, untagged)
#           -> manifest (per variant: one OCI index over both digests, tagged,
#              then attested)
#
# Each architecture builds on a runner OF that architecture. The previous
# single-job `platforms: linux/amd64,linux/arm64` build ran both on one host,
# which meant either QEMU emulation (an LTO release build of the whole CLI,
# many times slower) or a cross toolchain the Dockerfiles only carried for the
# amd64 -> arm64 direction. Native legs need neither, and run in parallel.
#
# Tags are applied ONCE, to the index, after both legs succeed -- so a pull
# never resolves to a half-published, single-architecture `latest`.
jobs:
  version:
    name: Resolve version
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: Cargo.toml
          sparse-checkout-cone-mode: false

      # `github.event.release.tag_name` is unset on `workflow_dispatch`, so
      # this falls back to the SAME `sed` this repo's own `mise run
      # docker:build` task uses against the workspace's virtual-manifest
      # `Cargo.toml` (`[workspace.package] version = "..."`) -- one place
      # defines how the version is read, whether that is a human tagging a
      # release or a manual dispatch off main.
      - name: Resolve version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail

          VERSION="${RELEASE_TAG}"
          if [ -z "${VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          fi
          if [ -z "${VERSION}" ]; then
            RAW=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml)
            VERSION="v${RAW:-0.1.0}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

  build:
    name: Build (${{ matrix.variant }}, ${{ matrix.arch }})
    needs: [version]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, rootless]
        arch: [amd64, arm64]
        include:
          # The standard image: fixed uid 10000, root-owned binary. Tagged
          # plain (`v0.0.1-1`, `latest`).
          - variant: standard
            dockerfile: docker/Dockerfile
          # The rootless / arbitrary-UID variant, published alongside the
          # standard image rather than left as a build-it-yourself option:
          # OpenShift and rootless-Podman deployments are a real, common
          # target for a CLI shipped as a container. Tagged with a `-rootless`
          # suffix (`v0.0.1-1-rootless`, `latest-rootless`) so both variants
          # are unambiguous and independently pullable.
          - variant: rootless
            dockerfile: docker/Dockerfile.rootless
          # Runner labels must GUARANTEE the architecture, so neither leg falls
          # back to the repo-wide `RUNS_ON`, which may be either. GitHub's
          # hosted `ubuntu-24.04-arm` is free for public repositories.
          - arch: amd64
            platform: linux/amd64
            runner: ${{ vars.RUNS_ON_AMD64 || 'ubuntu-latest' }}
          - arch: arm64
            platform: linux/arm64
            runner: ${{ vars.RUNS_ON_ARM64 || 'ubuntu-24.04-arm' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: "true"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN || github.token }}

      # Labels only: tags belong to the index the `manifest` job assembles.
      - name: Derive image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ needs.version.outputs.version }}

      # Pushed by digest and untagged (`push-by-digest`), so nothing is
      # pullable by name until both architectures exist.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # No `build-args: APP_VERSION=...`. The Dockerfiles no longer declare
          # that ARG: it only ever reached a `CARGO_BUILD_VERSION` export, which
          # cargo does not read, so it never influenced the binary and its
          # `0.1.0` default sat stale while the workspace was at 0.0.1-1. The
          # image's version identity comes from three places that cannot drift:
          # the binary's own `CARGO_PKG_VERSION` (`glaucus version` ->
          # `v0.0.1-1`), the `GIT_COMMIT` stamp from `crates/glaucus/build.rs`,
          # and the `org.opencontainers.image.version` label `metadata-action`
          # derives from the version above.
          #
          # Scoped per variant AND architecture: the legs share almost every
          # layer within a variant, but each architecture's layers are
          # disjoint, and separate scopes stop one leg evicting another's cache
          # under GitHub's per-repo cache size cap.
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Manifest (${{ matrix.variant }})
    needs: [version, build]
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read
      # Push the index and the attestation referrer to ghcr.io.
      packages: write
      # Sigstore keyless signing of the attestation.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            suffix: ""
          - variant: rootless
            suffix: "-rootless"
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN || github.token }}

      # `flavor: suffix=...` appends `-rootless` to EVERY tag this produces,
      # including `latest` -> `latest-rootless` -- so the two variants never
      # collide on a tag, and the standard variant (empty suffix) is unaffected.
      #
      # `DOCKER_METADATA_ANNOTATIONS_LEVELS=index` emits the OCI annotations
      # for the index itself, which is what ghcr.io reads for the package's
      # description and source link.
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          # `latest` is gated on a published, non-prerelease Release. Ungated,
          # ANY `workflow_dispatch` moved it -- including a manual rebuild of an
          # OLD version, which would have silently rolled `latest` backwards for
          # every `docker pull ghcr.io/<owner>/glaucus` in existence. The
          # exact-version tag still publishes on every dispatch, so a manual
          # rebuild remains possible without touching the floating pointer.
          #
          # `&&` short-circuits, so on a dispatch the `prerelease` half is never
          # evaluated -- which matters, because `github.event.release` is null
          # outside a release event.
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      # Arguments are built as an array from the metadata JSON rather than
      # spliced into the command line, so a tag or annotation value can never
      # be re-split by the shell.
      - name: Create and push the multi-arch index
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION_TAG: ${{ needs.version.outputs.version }}${{ matrix.suffix }}
        run: |
          set -Eeuo pipefail

          args=()
          while IFS= read -r tag; do
            args+=(--tag "${tag}")
          done < <(jq -r '.tags[]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
          while IFS= read -r annotation; do
            args+=(--annotation "${annotation}")
          done < <(jq -r '.annotations[]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
          for digest in *; do
            args+=("${IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create "${args[@]}"

          # Fail closed: the index must cover exactly the two architectures,
          # or a missing leg would ship silently as a one-arch image.
          raw="$(docker buildx imagetools inspect --raw "${IMAGE}:${VERSION_TAG}")"
          platforms="$(jq -r '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | sort | join(",")' <<< "${raw}")"
          if [ "${platforms}" != "linux/amd64,linux/arm64" ]; then
            echo "::error::index ${IMAGE}:${VERSION_TAG} covers '${platforms}', expected linux/amd64,linux/arm64"
            exit 1
          fi

          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION_TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Published ${IMAGE}:${VERSION_TAG} (${platforms}) at ${digest}"

      # Build provenance for the INDEX digest, pushed to ghcr.io as an OCI
      # referrer so it travels with the image:
      #   gh attestation verify oci://ghcr.io/<owner>/glaucus:<tag> --repo <owner>/glaucus
      # Storage records are an organization-only feature; this repository is
      # user-owned, so asking for one would fail the step.
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
