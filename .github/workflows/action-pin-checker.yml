name: Action Pin Checker

concurrency:
  group: action-pin-checker-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-pins:
    name: Action SHA Pins
    runs-on: ${{ vars.RUNS_ON_ARM64 || vars.RUNS_ON || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN || github.token }}

      - name: Install httpx (action pins script dependency)
        run: pipx install httpx

      - name: Verify action pins are up-to-date
        run: python3 scripts/update-actions-pins.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
