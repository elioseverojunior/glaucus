name: Scorecards

concurrency:
  group: scorecards-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

# `schedule` and `push` are what make results PUBLISHABLE. `publish_results: true`
# only uploads to the OSSF API from a scheduled run or a push on the default
# branch -- a `branch_protection_rule` run analyses fine but publishes nothing,
# so scorecard.dev had no data for this repo and reported "invalid repo path".
on:
  schedule:
    - cron: "0 7 * * 1"
  push:
    branches: [main]
  branch_protection_rule:
  workflow_dispatch:

# Top-level read-all; jobs that upload results need additional write permissions.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    # HARDCODED, and the one job in this repository that must stay that way --
    # deliberately not the `vars.RUNS_ON_ARM64 || vars.RUNS_ON || 'ubuntu-latest'`
    # expression every other job uses.
    #
    # OpenSSF verifies the workflow before accepting results, and requires the
    # scorecard job to name exactly one Ubuntu runner STATICALLY. It cannot
    # resolve an expression, so it rejected every upload with:
    #
    #   400 {"code":400,"message":"workflow verification failed: scorecard job
    #   should have exactly 1 'Ubuntu' virtual environment"}
    #
    # The action retries three times and then downgrades the failure to
    # `::warning::Unable to POST scorecard results to webapp`, so the job still
    # reported success while nothing was ever published -- which is why the badge
    # and https://scorecard.dev/viewer/?uri=github.com/elioseverojunior/glaucus
    # returned 404 from the first run onward. The scan itself always worked; only
    # the publish step failed.
    #
    # This forecloses self-hosted arm64 for THIS job specifically: the upstream
    # restrictions do not permit self-hosted runners for published results at
    # all, so it is a badge-or-self-hosted choice, not a configuration to tune.
    # Every other job keeps the expression.
    # https://github.com/ossf/scorecard-action#workflow-restrictions
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge (see publish_results below).
      id-token: write
      contents: read
      actions: read
      # To allow GraphQL ListCommits to work
      issues: read
      pull-requests: read
      # To detect SAST tools
      checks: read
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          fetch-depth: 0
          fetch-tags: "true"
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN || github.token }}
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # (Optional) "write" PAT token. Uncomment the `repo_token` line below if:
          # - you want to enable the Branch-Protection check on a *public* repository, or
          # - you are installing Scorecards on a *private* repository
          # To create the PAT, follow the steps in https://github.com/ossf/scorecard-action#authentication-with-pat.
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}

          # Public repositories:
          #   - Publish results to OpenSSF REST API for easy access by consumers
          #   - Allows the repository to include the Scorecard badge.
          #   - See https://github.com/ossf/scorecard-action#publishing-results.
          # For private repositories:
          #   - `publish_results` will always be set to `false`, regardless
          #     of the value entered here.
          publish_results: true

      # Upload the results as artifacts (optional). Commenting out will disable uploads of run results in SARIF
      # format to the repository Actions tab.
      - name: "Upload artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: results.sarif
