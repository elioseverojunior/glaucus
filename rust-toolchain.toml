# Canonical Rust toolchain definition (read by rustup, cargo, IDEs, and mise).
# This is the single source of truth for the DEVELOPMENT toolchain, and it tracks
# stable.
#
# It is deliberately DECOUPLED from `rust-version` in Cargo.toml, which is a
# different promise: the oldest rustc a CONSUMER needs. Keeping the two "in
# sync" -- as this comment used to instruct -- is exactly what pushed the
# published MSRV to 1.97 while the code still compiled on 1.88, turning every
# routine toolchain bump into a silent breaking change downstream (issue #3).
#
# So: bump this freely to pick up new compiler features and lints. Only change
# `rust-version` when the code genuinely stops building on the old floor, and
# treat that as a minor version bump. The `MSRV` job in cicd.yml enforces the
# gap by compiling against `rust-version`, not against this file.
[toolchain]
channel = "1.97"
profile = "default"
# rustfmt + clippy come with `profile = "default"` but are listed explicitly as a
# guarantee. llvm-tools is required by the cargo-tarpaulin llvm coverage engine
# (see tarpaulin.toml); without it, `cargo tarpaulin --engine llvm` cannot run.
# rust-src is needed for rust-analyzer/IDE std navigation and source-based
# tooling; declaring it keeps fresh clones and CI reproducible (not IDE-only).
components = ["rustfmt", "clippy", "llvm-tools", "rust-src"]
targets = [
  "wasm32-unknown-unknown",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
]
